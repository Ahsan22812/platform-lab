# Tier-1 CI: static checks only — lint and validate, no cluster.
#
# Guards on every push/PR: shell scripts (shellcheck), Kubernetes
# manifests rendered from charts (helm template + kubeconform), vendored
# chart integrity + renderability, and secrets (gitleaks). No standalone
# YAML lint — chart templates are Go-templated (not YAML); their output
# is validated by rendering, and values/Chart.yaml syntax is caught by
# helm. Integration testing (spin up kind, install charts) is Tier-2 and
# deliberately deferred — see docs/roadmap.md.
#
# Engine: GitHub Actions is this repo's CI gate. Jenkins is planned as a
# deploy-and-operate lab component, not the repo's gate. CD is Argo CD.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege — these jobs only read the repo.
permissions:
  contents: read

# Supersede in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # TODO(layer-4 hardening): pin actions to a commit SHA, not a tag.
      - uses: actions/checkout@v5
      # Lint every tracked shell script (not just scripts/) — picks up
      # component install.sh and dashboards/fetch.sh too; git ls-files
      # excludes the gitignored local hook. -x follows sourced files;
      # --source-path=SCRIPTDIR resolves `source=` dirs per script.
      - run: shellcheck -x --source-path=SCRIPTDIR $(git ls-files '*.sh')

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: install helm + kubeconform
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      # Render the podinfo chart, then validate the output against the
      # Kubernetes schema. helm dependency update vendors the shared
      # 'common' library first. --api-versions forces the ServiceMonitor
      # to render (no live cluster in CI); the CRDs catalog supplies its
      # schema, and -ignore-missing-schemas tolerates other CRDs.
      - name: render + validate
        run: |
          helm dependency update charts/podinfo
          helm template podinfo charts/podinfo --api-versions monitoring.coreos.com/v1 \
            | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -ignore-missing-schemas

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Direct install (no Node-based action) — keeps the third-party
      # action surface small and avoids the Node-runtime deprecation.
      - name: install helm
        run: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      # Integrity: each vendored chart must match its recorded checksum.
      - name: verify chart checksums
        run: |
          for sha in platform/observability/*/charts/*.sha256; do
            ( cd "$(dirname "$sha")" && shasum -c "$(basename "$sha")" )
          done
      # Renderability: every vendored chart must template cleanly. Uses
      # the component's values.yaml once it exists, default values until then.
      - name: helm template smoke test
        run: |
          for chart in platform/observability/*/charts/*.tgz; do
            comp="$(dirname "$(dirname "$chart")")"
            if [ -f "$comp/values.yaml" ]; then
              helm template smoke "$chart" --values "$comp/values.yaml" >/dev/null
            else
              helm template smoke "$chart" >/dev/null
            fi
            echo "rendered OK: $chart"
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the scan covers all commits
      # Pinned version, direct download — no GitHub API call (the
      # unauthenticated API is rate-limited on shared runner IPs). -f
      # makes a bad URL fail loudly instead of piping a 404 into tar.
      # Bump deliberately.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz
          sudo mv gitleaks /usr/local/bin/
      - run: gitleaks detect --no-banner --redact --source .
