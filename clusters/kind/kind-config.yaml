# kind cluster definition for the platform-lab.
#
# Three nodes: 1 control plane + 2 workers.
# Node image is pinned by digest for reproducibility — matches the default
# image shipped with kind v0.31.0 (Kubernetes 1.35.0).
#
# Port mappings expose 80/443 on the control plane so a future ingress
# controller can serve traffic at https://*.localtest.me on the host.
#
# Docs: https://kind.sigs.k8s.io/docs/user/configuration/

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform-lab

networking:
  apiServerAddress: "127.0.0.1"

nodes:
  - role: control-plane
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    # Label the control-plane node so ingress-nginx (installed later) can
    # use a nodeSelector to pin its DaemonSet here, matching the host
    # ports mapped below. This is the standard kind + ingress-nginx recipe.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP

  - role: worker
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f

  - role: worker
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
