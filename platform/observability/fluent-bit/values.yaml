# Helm values for the Fluent Bit umbrella chart on platform-lab.
#
# This directory is a thin umbrella: the real chart is the vendored
# charts/fluent-bit-0.57.7.tgz (subchart name "fluent-bit"), so ALL Fluent
# Bit settings nest under the `fluent-bit:` key below (subchart value
# scoping). Keeping the .tgz vendored (ADR 0004) lets Argo CD consume it
# from a git path without unpacking the chart.
#
# Fluent Bit runs as a DaemonSet — one pod per node tails container logs,
# enriches them with Kubernetes metadata, and ships to Loki. Chosen over
# Grafana Alloy because it's vendor-neutral and fans out to multiple
# backends: when EFK lands, an Elasticsearch [OUTPUT] block is added here
# and the SAME DaemonSet feeds both Loki and Elasticsearch.

fluent-bit:

  # Tolerate the control-plane taint so logs from control-plane pods
  # (apiserver, etcd, scheduler…) are collected too — DaemonSet on all nodes.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi              # memory limit, no cpu limit (lab policy)

  # --- Hot reload: config changes apply live, without pod restarts ---
  # Adds --enable-hot-reload to Fluent Bit plus a configmap-reload sidecar
  # that watches the mounted config and POSTs /api/v2/reload when the
  # kubelet syncs a ConfigMap change (~1 min).
  #
  # TRADE-OFF (this REPLACES the chart's default checksum/config pod
  # annotation — the chart drops it when hotReload is on, so config changes
  # never restart pods): pushes are gapless (tail positions and in-memory
  # buffers survive, no shipping pause), but a REJECTED reload is SILENT —
  # pods stay Ready running the OLD config while git says otherwise, until
  # the next natural restart loads the broken config cold. Fluent Bit
  # exposes no failed-reload metric (only the success counter
  # fluentbit_hot_reloaded_times), so the compensating controls are:
  #   1. templates/fluent-bit-alerts.yaml — alerts on the CONSEQUENCES
  #      (pod down / nothing shipped / outputs failing), which catch a bad
  #      config whether it was rejected (stale drift) or applied (broken).
  #   2. README "Pushing a config change" — verify the reload counter
  #      bumped on EVERY pod after each push.
  hotReload:
    enabled: true
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        memory: 32Mi             # same policy: no cpu limit

  # Scrape Fluent Bit itself (/api/v2/metrics/prometheus on the http port) —
  # prerequisite for the alerts in templates/, and table stakes anyway: an
  # unmonitored log shipper is its own silent failure. kps's open
  # ServiceMonitor selectors pick this up automatically.
  serviceMonitor:
    enabled: true

  # Fluent Bit pipeline (classic .conf format the chart expects).
  config:
    service: |
      [SERVICE]
          Daemon        Off
          Flush         1
          Log_Level     info
          Parsers_File  /fluent-bit/etc/parsers.conf
          HTTP_Server   On
          HTTP_Listen   0.0.0.0
          HTTP_Port     2020
          Health_Check  On

    # Tail container logs. kind runs containerd → CRI log format, so use
    # the cri multiline parser (handles partial/multiline lines).
    inputs: |
      [INPUT]
          Name              tail
          Tag               kube.*
          Path              /var/log/containers/*.log
          multiline.parser  cri
          Mem_Buf_Limit     5MB
          Skip_Long_Lines   On

    # Enrich each record with Kubernetes metadata (namespace, pod,
    # container, labels) by querying the API.
    filters: |
      [FILTER]
          Name                kubernetes
          Match               kube.*
          Merge_Log           On
          Keep_Log            Off
          K8S-Logging.Parser  On
          K8S-Logging.Exclude On

      # The kubernetes filter nests metadata under a single "kubernetes" key.
      # Lift it to top-level fields (prefixed to avoid collisions with the log
      # body) so the Loki output can attach clean, short label names below.
      [FILTER]
          Name          nest
          Match         kube.*
          Operation     lift
          Nested_under  kubernetes
          Add_prefix    kubernetes_

      # Rename the three fields we promote to Loki stream labels, so queries
      # read {namespace="podinfo"} instead of {kubernetes_namespace_name=...}.
      [FILTER]
          Name    modify
          Match   kube.*
          Rename  kubernetes_namespace_name namespace
          Rename  kubernetes_pod_name       pod
          Rename  kubernetes_container_name container

    # Ship to Loki. Stream labels kept deliberately small (namespace, pod,
    # container) — Loki cardinality is driven by label combinations, so we
    # don't blanket every k8s field into a label.
    outputs: |
      [OUTPUT]
          Name        loki
          Match       kube.*
          Host        loki.monitoring.svc.cluster.local
          Port        3100
          Labels      job=fluent-bit
          Label_Keys  $namespace,$pod,$container
          Auto_Kubernetes_Labels Off
          Line_Format json
