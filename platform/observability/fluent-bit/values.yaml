# Helm values for Fluent Bit on the platform-lab kind cluster.
#
# Chart: fluent/fluent-bit (CNCF). appVersion 5.0.7.
#
# Runs as a DaemonSet — one pod per node tails container logs, enriches
# them with Kubernetes metadata, and ships to Loki. Chosen over Grafana
# Alloy because it's vendor-neutral and fans out to multiple backends:
# when EFK lands, an Elasticsearch [OUTPUT] block is added here and the
# SAME DaemonSet feeds both Loki and Elasticsearch.
#
# First cut — validate with `helm template`; confirm the Loki stream
# labels at query time in Grafana and adjust Label_Keys if needed.

# Tolerate the control-plane taint so logs from control-plane pods
# (apiserver, etcd, scheduler…) are collected too — DaemonSet on all nodes.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi              # memory limit, no cpu limit (lab policy)

# Fluent Bit pipeline (classic .conf format the chart expects).
config:
  service: |
    [SERVICE]
        Daemon        Off
        Flush         1
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

  # Tail container logs. kind runs containerd → CRI log format, so use
  # the cri multiline parser (handles partial/multiline lines).
  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        multiline.parser  cri
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On

  # Enrich each record with Kubernetes metadata (namespace, pod,
  # container, labels) by querying the API.
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

    # The kubernetes filter nests metadata under a single "kubernetes" key.
    # Lift it to top-level fields (prefixed to avoid collisions with the log
    # body) so the Loki output can attach clean, short label names below.
    [FILTER]
        Name          nest
        Match         kube.*
        Operation     lift
        Nested_under  kubernetes
        Add_prefix    kubernetes_

    # Rename the three fields we promote to Loki stream labels, so queries
    # read {namespace="podinfo"} instead of {kubernetes_namespace_name=...}.
    [FILTER]
        Name    modify
        Match   kube.*
        Rename  kubernetes_namespace_name namespace
        Rename  kubernetes_pod_name       pod
        Rename  kubernetes_container_name container

  # Ship to Loki. Stream labels kept deliberately small (namespace, pod,
  # container) — Loki cardinality is driven by label combinations, so we
  # don't blanket every k8s field into a label.
  outputs: |
    [OUTPUT]
        Name        loki
        Match       kube.*
        Host        loki.monitoring.svc.cluster.local
        Port        3100
        Labels      job=fluent-bit
        Label_Keys  $namespace,$pod,$container
        Auto_Kubernetes_Labels Off
        Line_Format json
