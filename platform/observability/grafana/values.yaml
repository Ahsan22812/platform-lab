# Helm values for the Grafana umbrella chart on platform-lab.
#
# This directory is a thin umbrella: the real chart is the vendored
# charts/grafana-12.4.5.tgz (subchart name "grafana"), so ALL Grafana
# settings nest under the `grafana:` key below (subchart value scoping).
# Keeping the .tgz vendored (ADR 0004) lets Argo CD consume it from a git
# path without unpacking the chart.
#
# Reference: https://github.com/grafana-community/helm-charts/tree/main/charts/grafana
# Only overrides are listed — everything else uses chart defaults.

grafana:

  # --- Admin credentials ---
  # Referenced from a Kubernetes Secret that is created MANUALLY, once, and
  # never committed (this is a public repo):
  #   kubectl -n monitoring create secret generic grafana-admin \
  #     --from-literal=admin-user=admin --from-literal=admin-password=<yours>
  # GitOps forced this correctness: the old install.sh passed the password
  # via --set-string at install time, which Argo CD has no equivalent for
  # (and which parked the password in the Helm release values anyway).
  # Layer 5 target: the SAME Secret synced from Vault by External Secrets
  # Operator — config-only change here. See TODO.md.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  # --- Service & networking ---
  service:
    type: ClusterIP
    port: 80

  # --- Persistence ---
  # Disabled: Grafana's SQLite DB lives in emptyDir and is lost on pod
  # restart. Dashboards + datasources are re-provisioned from this file on
  # every start, so the loss is cosmetic (logins, stars). Temporary —
  # flip to a PVC at Layer 3+ when persistent storage lands.
  persistence:
    enabled: false

  # --- Replicas / resources ---
  # replicas: 1 is a real constraint, not a shortcut — Grafana HA needs an
  # external shared database (Postgres/MySQL), out of scope for this lab.
  replicas: 1
  resources:
    # Policy: always set requests (cpu+memory) and a memory limit;
    # deliberately NO cpu limit (CFS throttling hurts a UI workload).
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # --- Pod security ---
  securityContext:
    runAsNonRoot: true
    runAsUser: 472          # grafana's uid
    runAsGroup: 472
    fsGroup: 472
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false   # Grafana writes to /var/lib/grafana
    capabilities:
      drop:
        - ALL

  # --- Grafana settings ---
  # server.root_url is intentionally unset — the built-in default works for
  # port-forward (localhost:3000). Set it to the public URL when ingress
  # lands, so generated links (alerts, share) are correct.
  grafana.ini:
    users:
      allow_sign_up: false        # admin creates all users
    analytics:
      reporting_enabled: false
      check_for_updates: false

  defaultDashboardsTimezone: browser

  # --- Datasources (provisioned on every pod start) ---
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          # Stable uid — vendored dashboards (dashboards/) bind to this.
          uid: prometheus
          access: proxy
          # Must match the kube-prometheus-stack Prometheus Service.
          url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
          isDefault: true
          editable: false
          # Future: Loki, Tempo, Thanos added here as new entries.

  # --- Dashboards ---
  # Vendored as JSON in dashboards/ and rendered as sidecar-labelled
  # ConfigMaps by the umbrella's own templates/dashboards.yaml (previously
  # created out-of-band by install.sh). No grafana.com fetch at pod start —
  # closes ADR 0004's third external dependency. See dashboards/SOURCE.txt.
  # No `dashboards:` / `dashboardProviders:` blocks here on purpose — the
  # sidecar manages its own provider; those blocks are only for the
  # chart's gnetId-download path, which we no longer use.

  # --- Sidecars — auto-import dashboards/datasources from ConfigMaps ---
  # Other components (Loki, app charts) can ship a ConfigMap labelled
  # grafana_dashboard: "1" and it's picked up automatically.
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL
